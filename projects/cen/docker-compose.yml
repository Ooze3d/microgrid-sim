services:
  breaker-sotano:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: breaker-sotano
    command: python -m app.device_server --config /app/configs/breaker_sotano.yaml

    volumes:
      - ./configs:/app/configs

    network_mode: host

    restart: unless-stopped

  nsx-acometida-1:
