  - name: Power_Phase1_Total
    address: 9000
    register_type: input
    type: int32
    word_order: big
    value: 3667

  - name: Power_Phase2_Total
    address: 9002
    register_type: input
    type: int32
    word_order: big
    value: 3667

  - name: Power_Phase3_Total
    address: 9004
    register_type: input
    type: int32
    word_order: big
    value: 3666

  - name: Number_Available_CPs
    address: 9006
    register_type: input
    type: int32
    word_order: big
    value: 1